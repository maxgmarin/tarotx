[package]
name = "tarotx"
version = "0.1.0"
edition = "2021"
description = "A toolkit for stranded, trimmed long-read RNA-seq alignments: gene assignment and internal-priming labels"
license = "GPL-3.0-only"
repository = "https://github.com/maxgmarin/tarotx"

[dependencies]
clap   = { version = "=4.6.7", features = ["derive"] }
anyhow = "=1.0.102"

# Parquet table input and output, set up as in maligno. Pinned exactly and feature-trimmed: default
# features would pull arrow-csv/json/cast, the regex stack and the brotli/lz4 codecs. The three
# versions must move together. zstd (output, and maligno's files) compiles bundled C (zstd-sys); snap
# (pure Rust) reads pandas'/pyarrow's default snappy-compressed files.
arrow-array  = { version = "=59.3.0", default-features = false }
arrow-schema = { version = "=59.3.0", default-features = false }
parquet      = { version = "=59.3.0", default-features = false, features = ["arrow", "zstd", "snap"] }

# gzip/BGZF text input and .gz output. zlib-rs is faster than the default miniz_oxide.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
